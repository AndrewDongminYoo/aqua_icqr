version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - python@3.14.4
lint:
  enabled:
    - actionlint@1.7.12
    - osv-scanner@2.7.0
    - pinact@4.1.1!
    - trufflehog@3.99.7
  definitions:
    - name: pinact
      commands:
        - name: lint
          enabled: true
        - name: upgrade
          enabled: true
    - name: trufflehog
      commands:
        - name: lint
          # Scan locally without sending candidate credentials to providers.
          run: trufflehog filesystem --json --fail --no-verification --no-update ${target}
actions:
  enabled:
    - trunk-check-pre-push
